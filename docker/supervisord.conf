[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:api]
command=/opt/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000
directory=/app/backend
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:watcher]
command=/opt/venv/bin/python watcher.py
directory=/app/backend
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
environment=MEMORIA_WATCHER="1"
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:worker]
command=/opt/venv/bin/huey_consumer workers.huey -w %(ENV_MEMORIA_HUEY_WORKERS)s -k thread -v
directory=/app/backend
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
environment=MEMORIA_HUEY_CONSUMER="1"
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:frontend]
command=/usr/local/bin/node server.js
directory=/app/frontend
priority=40
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
environment=HOSTNAME="0.0.0.0",PORT="5004",NODE_ENV="production"
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[eventlistener:fatal-exit]
command=/opt/venv/bin/python /app/docker/supervisor_fatal.py
events=PROCESS_STATE_FATAL
priority=1
autostart=true
autorestart=true
redirect_stderr=false
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
